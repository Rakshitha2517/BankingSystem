<!DOCTYPE html>
<html>
<head>
    <title>Bank System</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: #2c3e50;
        }

        .balance {
            background: #2ecc71;
            color: white;
            padding: 10px;
            border-radius: 5px;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .deposit {
            background: #3498db;
        }

        .withdraw {
            background: #e74c3c;
        }

        .msg {
            color: green;
            font-weight: bold;
        }

        ul {
            text-align: left;
        }

        .transactions {
            margin-top: 20px;
            text-align: left;
        }

        .box {
            background: #ecf0f1;
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>🏦 Bank System</h1>

    <div class="balance">
        <h2>Balance: ₹{{ balance }}</h2>
    </div>

    <form action="/deposit" method="post">
        <input type="number" name="amount" placeholder="Enter amount"><br>
        <button class="deposit">Deposit</button>
    </form>

    <form action="/withdraw" method="post">
        <input type="number" name="amount" placeholder="Enter amount"><br>
        <button class="withdraw">Withdraw</button>
    </form>

    <p class="msg">{{ msg }}</p>

    <div class="transactions">
        <h3>📜 Transaction History</h3>

        {% if transactions %}
            {% for t in transactions %}
                <div class="box">{{ t }}</div>
            {% endfor %}
        {% else %}
            <p>No transactions yet</p>
        {% endif %}
    </div>

</div>

</body>
</html>
